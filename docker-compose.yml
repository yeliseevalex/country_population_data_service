services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: population_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  get_data:
    build: .
    command: python -m src.get_data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/population_db
      - DATA_SOURCE=${DATA_SOURCE:-wikipedia}
    volumes:
      - .:/app

  print_data:
    build: .
    command: python -m src.print_data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/population_db
    volumes:
      - .:/app

volumes:
  postgres_data:


